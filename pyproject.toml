[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vision-agent"
version = "0.2.0"
description = "A safe, hybrid screenshot/OCR desktop agent with multimodal reasoning and training tools"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["Pillow>=10.0", "Flask>=3.0"]

[project.optional-dependencies]
desktop = ["mss>=9.0", "pyautogui>=0.9.54", "pytesseract>=0.3.13"]
llm = ["openai>=1.0"]
test = ["pytest>=8.0"]

[project.scripts]
vision-agent = "vision_agent.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["vision_agent*"]
