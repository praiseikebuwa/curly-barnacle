[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vision-agent"
version = "0.3.0"
description = "VisionOS AI: extensible safe computer-use platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["Pillow>=10.0", "Flask>=3.0", "fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2.0"]

[project.optional-dependencies]
desktop = ["mss>=9.0", "pyautogui>=0.9.54", "pytesseract>=0.3.13"]
llm = ["openai>=1.0"]
test = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
vision-agent = "vision_agent.cli:main"
visionos-api = "vision_agent.api_runner:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["vision_agent*"]
