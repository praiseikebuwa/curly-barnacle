name: Vision Agent CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test-and-train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[test]'
      - run: python -m pytest -q
      - run: python -m scripts.from_scratch train-vision --data /tmp/vision-data --checkpoint /tmp/vision-model.npz --report /tmp/vision-report.json --epochs 25
      - run: python -m scripts.from_scratch evaluate-vision --data /tmp/vision-data --checkpoint /tmp/vision-model.npz
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
